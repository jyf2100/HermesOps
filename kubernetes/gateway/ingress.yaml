apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: hermes-agent
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /agent1(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: hermes-gateway-1
                port:
                  number: 6060
          - path: /agent2(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: hermes-gateway-2
                port:
                  number: 6060
          - path: /agent3(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: hermes-gateway-3
                port:
                  number: 6060
          - path: /agent4(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: hermes-gateway-4
                port:
                  number: 6060
          - path: /agent5(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: hermes-gateway-5
                port:
                  number: 6060
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-gateway-1-nip
  namespace: hermes-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: agent1.172-32-153-184.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes-gateway-1
                port:
                  number: 6060
---
