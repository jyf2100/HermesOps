apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-admin
  namespace: hermes-agent
  labels:
    app: hermes-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-admin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-admin
      annotations:
        kubectl.kubernetes.io/restartedAt: ""
    spec:
      serviceAccountName: hermes-admin
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      initContainers:
        - name: fix-permissions
          image: hermes-admin:latest
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /data/hermes/_admin/templates
              mkdir -p /data/hermes/_backups
              mkdir -p /data/hermes/hub-cache
              chown -R 10000:10000 /data/hermes/ 2>/dev/null || true
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: hermes-data-root
              mountPath: /data/hermes
      containers:
        - name: admin
          image: hermes-admin:latest
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 48082
              protocol: TCP
          env:
            - name: K8S_NAMESPACE
              value: "hermes-agent"
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-admin-secret
                  key: admin_key
            - name: HERMES_DATA_ROOT
              value: "/data/hermes"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: database-url
            - name: WEBUI_INTERNAL_URL
              value: "http://hermes-webui:8080"
            - name: EXTERNAL_WEBUI_URL
              value: "http://172.32.153.184:40080"
            - name: EXTERNAL_API_BASE
              value: "http://172.32.153.184:40080"
            - name: EXTERNAL_URL_PREFIX
              value: "http://172.32.153.184:40080"
            - name: ADMIN_CORS_ORIGINS
              value: "http://172.32.153.184:40080"
            - name: CLUSTER_IP
              value: "172.32.153.184"
            - name: INGRESS_PORT
              value: "40080"
            - name: ORCHESTRATOR_INTERNAL_URL
              value: "http://hermes-orchestrator:8080"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hub-github-token
                  key: github-token
                  optional: true
            - name: HUB_CACHE_DIR
              value: "/data/hermes/hub-cache"
            - name: HERMES_OPTIONAL_SKILLS
              value: "/app/optional-skills"
            - name: WEBUI_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: hermes-admin-secret
                  key: webui-admin-email
                  optional: true
            - name: WEBUI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-admin-secret
                  key: webui-admin-password
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: hermes-data-root
              mountPath: /data/hermes
              readOnly: false
      volumes:
        - name: hermes-data-root
          hostPath:
            path: /data/hermes
            type: DirectoryOrCreate

