apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-admin
  namespace: hermes-agent
spec:
  template:
    spec:
      containers:
        - name: admin
          env:
            - name: EXTERNAL_WEBUI_URL
              value: "http://172.32.153.184:48080"
            - name: EXTERNAL_API_BASE
              value: "http://172.32.153.184:40080"
            - name: EXTERNAL_URL_PREFIX
              value: "http://172.32.153.184:40080"
            - name: ADMIN_CORS_ORIGINS
              value: "http://172.32.153.184:40080"
            - name: INGRESS_PORT
              value: "40080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hermes-database-secret
                  key: database-url
            - name: ORCHESTRATOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-admin-env-secrets
                  key: orchestrator-api-key
            - name: ADMIN_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-admin-env-secrets
                  key: admin-internal-token
